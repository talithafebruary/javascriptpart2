<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARENA CYBER TALITHA 3000</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    background: radial-gradient(circle, #001020, #000000);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    margin: 0;
}

h2 {
    font-size: 40px;
    margin-top: 20px;
    text-shadow: 0 0 25px cyan, 0 0 40px blue;
}

#game {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.player-box {
    width: 300px;
    padding: 20px;
    background: rgba(0, 20, 50, 0.7);
    border-radius: 20px;
    border: 2px solid cyan;
    box-shadow: 0 0 25px cyan inset, 0 0 25px cyan;
    transition: 0.4s;
    position: relative;
}

.energy-bar {
    width: 100%;
    height: 25px;
    background: #111;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 15px;
    border: 2px solid cyan;
}

.energy-fill {
    height: 100%;
    background: #00ffaa;
    transition: width 0.3s;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    font-size: 16px;
    background: rgba(0, 255, 255, 0.3);
    border: 2px solid cyan;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: cyan;
    color: black;
    box-shadow: 0 0 20px cyan;
}

.shake {
    animation: shake 0.4s;
}

@keyframes shake {
    0% { transform: translate(0,0); }
    50% { transform: translate(-8px,0); }
    100% { transform: translate(0,0); }
}

.hit-effect {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, red, transparent);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: boom 0.4s ease-out;
}

@keyframes boom {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.5); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
}
</style>
</head>

<body>

<h2>⚔️ ARENA CYBER TALITHA 3000 ⚔️</h2>

<div id="game"></div>

<script src="lanjutanpart2.js"></script>
</body>
</html>
